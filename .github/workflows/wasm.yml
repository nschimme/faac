name: WASM Build and Deploy

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Build FAAC WASM via Meson
        run: |
          meson setup build-wasm --default-library=static --cross-file frontend/emscripten.cross -Dfrontend=true
          ninja -C build-wasm

      - name: Prepare Artifacts
        run: |
          mkdir -p dist
          cp frontend/index.html frontend/worker.js build-wasm/frontend/faac-wasm.js build-wasm/frontend/faac-wasm.wasm dist/
          cp frontend/faac.ico dist/favicon.ico

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: faac-wasm
          path: dist/

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build-wasm
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

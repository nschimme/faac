name: Continuous Integration

on:
  push:
    branches: [ "master" ]
    tags-ignore: ['*']
    paths-ignore: ['**.md']
  pull_request:
    branches: [ "**" ]
    paths-ignore: ['**.md']

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    defaults:
      run:
        shell: ${{ matrix.config.shell }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
              name: Linux GCC,
              os: ubuntu-latest,
              compiler: gcc,
              shell: bash,
            }
          - {
              name: Linux GCC (max 1 channel),
              os: ubuntu-latest,
              compiler: gcc,
              shell: bash,
              options: -Dmax-channels=1,
            }
          - {
              name: Linux GCC (max 2 channels),
              os: ubuntu-latest,
              compiler: gcc,
              shell: bash,
              options: -Dmax-channels=2,
            }
          - {
              name: Linux GCC (encoder PS and stats),
              os: ubuntu-latest,
              compiler: gcc,
              shell: bash,
              options: -Dencoder-ps=true -Dstats=true,
            }
          - {
              name: Linux GCC (SBR decimation 4),
              os: ubuntu-latest,
              compiler: gcc,
              shell: bash,
              options: -Dsbr-decimation=4,
            }
          - {
              name: Linux GCC (muxer without video or fragmented),
              os: ubuntu-latest,
              compiler: gcc,
              shell: bash,
              options: -Dmuxer-video=false -Dmuxer-fragmented=false,
            }
          - {
              name: Linux GCC (no encoder),
              os: ubuntu-latest,
              compiler: gcc,
              shell: bash,
              options: -Dencoder=false,
            }
          - {
              name: Linux GCC (DAB disabled),
              os: ubuntu-latest,
              compiler: gcc,
              shell: bash,
              options: -Ddecoder-dab=false,
            }
          - {
              name: Linux GCC (DRC disabled),
              os: ubuntu-latest,
              compiler: gcc,
              shell: bash,
              options: -Ddecoder-drc=false,
            }
          - {
              name: Linux GCC (32-bit),
              os: ubuntu-latest,
              compiler: gcc,
              shell: bash,
              packages: gcc-multilib,
              options: -Dc_args=-m32 -Dc_link_args=-m32,
            }
          - {
              name: macOS Clang,
              os: macos-latest,
              compiler: clang,
              shell: bash,
            }
          - {
              name: MSYS2 UCRT64,
              os: windows-latest,
              compiler: gcc,
              shell: 'msys2 {0}',
              msystem: ucrt64,
              msys-env: mingw-w64-ucrt-x86_64,
              options: -Dfrontend-static=true,
            }
          - {
              name: Windows MSVC,
              os: windows-latest,
              compiler: cl,
              shell: pwsh,
              options: -Dfrontend-static=true,
            }

    steps:
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ${{ matrix.config.packages }}

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          brew update || true
          brew install \
            meson

      - name: Install dependencies (MSYS2)
        if: matrix.config.shell == 'msys2 {0}'
        uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: ${{ matrix.config.msystem }}
          update: false
          install: >-
            ${{ matrix.config.msys-env }}-meson
            ${{ matrix.config.msys-env }}-gcc

      - name: Install dependencies (MSVC)
        if: matrix.config.compiler == 'cl'
        run: |
          pip install meson ninja

      - name: Set up MSVC
        if: matrix.config.compiler == 'cl'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/checkout@v7

      - name: Build (MSYS2)
        if: matrix.config.shell == 'msys2 {0}'
        env:
          CC: ${{ matrix.config.compiler }}
        run: |
          mkdir -p build temp
          cd build
          meson setup .. -Dprefix=$(realpath ../temp) ${{ matrix.config.options }}
          meson install

          for exe in ../temp/bin/faac.exe ../temp/bin/faacgui.exe ../temp/bin/faad.exe ../temp/bin/faam.exe; do
            test -f "$exe"
            if objdump -p "$exe" | grep -iE 'DLL Name:.*fa(ac|ad|am).*\.dll'; then
              echo "Unexpected FAAC/FAAD/FAAM DLL dependency in $exe" >&2
              exit 1
            fi
            # A static link must not re-export the libraries' API from the program.
            if objdump -p "$exe" | grep -E 'fa(ac|ad|am)_[a-z]'; then
              echo "Unexpected FAAC/FAAD/FAAM export in $exe" >&2
              exit 1
            fi
          done
          meson test --print-errorlogs
          # Keep all shared libraries in lib/ for applications that link to them.
          for dll in faac faad faam; do
            compgen -G "../temp/lib/*${dll}*.dll" > /dev/null
          done

      - name: Build (General)
        if: matrix.config.shell != 'msys2 {0}' && matrix.config.compiler != 'cl'
        env:
          CC: ${{ matrix.config.compiler }}
        run: |
          meson setup build -Dprefix="${{ github.workspace }}/temp" ${{ matrix.config.options }}
          meson install -C build

      - name: Test (General)
        if: matrix.config.shell != 'msys2 {0}' && matrix.config.compiler != 'cl'
        run: meson test -C build --print-errorlogs

      - name: Build (MSVC)
        if: matrix.config.compiler == 'cl'
        run: |
          meson setup build -Dprefix="${{ github.workspace }}/temp" ${{ matrix.config.options }}
          meson install -C build

          foreach ($exe in @('faac.exe', 'faacgui.exe', 'faad.exe', 'faam.exe')) {
            $imports = dumpbin /DEPENDENTS "temp/bin/$exe"
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect $exe imports" }
            if ($imports -match 'fa(ac|ad|am).*\.dll') { throw "$exe imports a FAAC/FAAD/FAAM DLL" }
            $exports = dumpbin /EXPORTS "temp/bin/$exe"
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect $exe exports" }
            if ($exports -match 'fa(ac|ad|am)_[a-z]') { throw "$exe exports a FAAC/FAAD/FAAM function" }
          }
          meson test -C build --print-errorlogs
          if ($LASTEXITCODE -ne 0) { throw 'Meson tests failed' }
          foreach ($lib in @('faac', 'faad', 'faam')) {
            if (-not (Get-ChildItem "temp/lib/*$lib*.dll")) { throw "$lib DLL is missing from the package" }
          }

      - name: Upload artifacts (Windows)
        uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: faac-${{ github.sha }}-${{ matrix.config.name }}
          path: temp/*

  fuzz-build:
    name: Fuzz harness build
    runs-on: ubuntu-latest
    env:
      CCACHE_DISABLE: 1

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build clang

      - name: Build fuzz harnesses
        run: |
          meson setup build -Dencoder-ps=true
          FUZZ_BUILD_ONLY=1 tests/fuzz/run.sh build

      - name: Test
        run: meson test -C build --print-errorlogs

  sanitize:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    env:
      CCACHE_DISABLE: 1

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build

      - name: Configure sanitizer build
        run: meson setup build -Db_sanitize=address,undefined -Db_lto=false -Db_lundef=false

      - name: Test
        run: meson test -C build --print-errorlogs --timeout-multiplier 4

  coverage:
    name: C unit test coverage
    runs-on: ubuntu-latest
    env:
      CCACHE_DISABLE: 1

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr meson ninja-build

      - name: Configure coverage build
        run: meson setup build-coverage -Db_coverage=true -Db_lto=false

      - name: Build
        run: meson compile -C build-coverage

      - name: Test
        run: meson test -C build-coverage --print-errorlogs

      - name: Generate coverage report
        run: |
          gcovr --gcov-ignore-parse-errors=negative_hits.warn --root . --txt -o build-coverage/meson-logs/coverage.txt build-coverage
          gcovr --gcov-ignore-parse-errors=negative_hits.warn --root . --xml-pretty -o build-coverage/meson-logs/coverage.xml build-coverage
          gcovr --gcov-ignore-parse-errors=negative_hits.warn --root . --json-summary-pretty -o build-coverage/meson-logs/coverage-summary.json build-coverage

      - name: Add coverage summary to Actions run
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("build-coverage/meson-logs/coverage-summary.json").read_text())
          rows = []
          for label, key in (("Lines", "line"), ("Branches", "branch"), ("Functions", "function")):
              rows.append(
                  f"| {label} | {report[f'{key}_covered']} | {report[f'{key}_total']} | {report[f'{key}_percent']:.1f}% |"
              )

          summary = "\n".join([
              "## C unit test coverage",
              "",
              "| Metric | Covered | Total | Coverage |",
              "| --- | ---: | ---: | ---: |",
              *rows,
              "",
              "Full text, XML, and JSON reports are available in the `c-unit-test-coverage` artifact.",
              "",
          ])
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(summary)
          PY

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: c-unit-test-coverage
          path: |
            build-coverage/meson-logs/coverage.txt
            build-coverage/meson-logs/coverage.xml
            build-coverage/meson-logs/coverage-summary.json

  cppcheck:
    name: Cppcheck
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck meson ninja-build

      - uses: actions/checkout@v7

      - name: Run cppcheck
        shell: bash
        run: |
          cppcheck --version
          cppcheck --error-exitcode=1 --inline-suppr -j4 -q --check-level=exhaustive -Iinclude/ libfaac/ frontend/

      - name: Configure tests
        run: meson setup build

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --print-errorlogs

  big-endian:
    name: Linux GCC (Big-endian)
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson gcc-s390x-linux-gnu qemu-user

      - name: Generate test input
        run: |
          python3 - <<'PY'
          import math, struct, wave
          rate, secs = 44100, 3
          seed = 12345
          w = wave.open('input.wav', 'wb')
          w.setnchannels(2); w.setsampwidth(2); w.setframerate(rate)
          out = bytearray()
          for i in range(rate * secs):
              seed = (seed * 1103515245 + 12345) & 0x7fffffff
              noise = ((seed >> 16) & 0x3ff) - 512
              t = i / rate
              l = int(9000 * math.sin(2 * math.pi * 440 * t) + 3000 * math.sin(2 * math.pi * 3520 * t) + noise)
              r = int(8000 * math.sin(2 * math.pi * 660 * t) + noise)
              out += struct.pack('<hh', l, r)
          w.writeframes(bytes(out)); w.close()
          PY

      - name: Build native reference
        run: |
          meson setup build-native -Ddefault_library=static
          meson compile -C build-native

      - name: Test native reference
        run: meson test -C build-native --print-errorlogs

      - name: Build s390x (big-endian)
        run: |
          cat > s390x.txt <<'EOF'
          [binaries]
          c = 's390x-linux-gnu-gcc'
          ar = 's390x-linux-gnu-ar'
          strip = 's390x-linux-gnu-strip'
          exe_wrapper = ['qemu-s390x']

          [host_machine]
          system = 'linux'
          cpu_family = 's390x'
          cpu = 's390x'
          endian = 'big'

          [properties]
          needs_exe_wrapper = true
          EOF
          meson setup build-s390x --cross-file s390x.txt -Ddefault_library=static -Dc_link_args=-static
          grep WORDS_BIGENDIAN build-s390x/config.h
          meson compile -C build-s390x

      - name: Test s390x (big-endian)
        run: meson test -C build-s390x --print-errorlogs

      - name: Encode natively and under qemu, compare
        run: |
          for fmt in aac m4a; do
            build-native/frontend/faac -o native.$fmt input.wav
            qemu-s390x build-s390x/frontend/faac -o s390x.$fmt input.wav
            ls -l native.$fmt s390x.$fmt
            cmp native.$fmt s390x.$fmt
          done
